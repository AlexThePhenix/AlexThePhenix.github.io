<!DOCTYPE html>
<html>
    <head>
        <title>Rocket go noom</title>
    </head>
    <body>
        <img src="./rocket2.png" class = "rocket">
        <script>
            const rocket = document.querySelector(".rocket");
           // rocket position
            let x = 0;
            let y = 0;
            // rocket velocity
            let vy = 0;
            let vx = 0;
            // rocket rotaion
            let a = 0;

            let mx = 0;
            let my = 0;

            document.onmousemove = function (e){
                mx = e.clientX;
                my = e.clientY;
                
                let dy = my - y
                let dx = mx - x
                if (dx !== 0 || dy !== 0)
                a = Math.atan2(dy,dx)
            }
        </script>
    </body>
    <style>
        .rocket{
            position: absolute;
            transform-origin: center;
        }
    </style>
</html>
