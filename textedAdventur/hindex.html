<!DOCTYPE html>
<html>
  <head>
    <title>Test</title>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <script src="./hg.js"></script>
    <script>
      const canvas = document.getElementById("canvas")

      const stage = hg.Stage(canvas, {
        w: 256,
        vbg: "rgb(0, 0, 0, 0)"
      })

      hg.Stage.scene(stage, {
        onAttach(context) {
          this.playerX = 0
          this.playerY = 0
          this.playerVelocityX = 200
          this.playerVelocityY = 200
          this.playerColor = `rgb(${Math.floor(Math.random() * 255)}, ${Math.floor(Math.random() * 255)}, ${Math.floor(Math.random() * 255)})`
        },

        onRender(context) {
          context.g.fillStyle = this.playerColor
          context.g.fillRect(
            this.playerX, 
            this.playerY,
            100, 100)
        },

        onUpdate(context) {
          const [w, h] = hg.Stage.getVirtualSize(context.stage)

          this.playerX += this.playerVelocityX * context.dt
          this.playerY += this.playerVelocityY * context.dt

          if(this.playerX < 0) {
            this.playerX = 0
            this.playerVelocityX = -this.playerVelocityX
          }

          if(this.playerX > w - 100) {
            this.playerX = w - 100
            this.playerVelocityX = -this.playerVelocityX
          }

          if(this.playerY < 0) {
            this.playerY = 0
            this.playerVelocityY = -this.playerVelocityY
          }

          if(this.playerY > h - 100) {
            this.playerY = h - 100
            this.playerVelocityY = -this.playerVelocityY
          }

          this.playerColor = `rgb(${Math.floor(Math.random() * 255)}, ${Math.floor(Math.random() * 255)}, ${Math.floor(Math.random() * 255)})`
        }
      })

    </script>
    <style>
      #canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </body>
</html>
